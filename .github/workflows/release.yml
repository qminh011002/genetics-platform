# Release image (T0105 · blueprint.md §4 · docs/ops/deploy-vm.md): CI chỉ build + push GHCR, không deploy / SSH.
# push `main` → ghcr.io/<owner>/genetics-{api,web,mobile}:sha-<sha7>  (staging)
# tag `v*`    → :vX.Y.Z — gắn lại đúng image `sha-<sha7>` đã chạy ở staging nếu có; chưa có thì build.
# Context / Dockerfile giữ khớp infra/compose.yaml và job `build` trong ci.yml. Dockerfile chưa có (T0107 / T0108) → bỏ qua.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/backend
            file: services/backend/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: mobile
            context: .
            file: apps/mobile/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        env:
          NAME: ${{ matrix.name }}
          FILE: ${{ matrix.file }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! -f "$FILE" ]]; then
            echo "::notice title=release::$FILE chưa có → bỏ qua image $NAME"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/genetics-$NAME"
            echo "sha_tag=sha-${GITHUB_SHA::7}"
            if [[ "$REF_TYPE" == tag ]]; then echo "version=$REF_NAME"; fi
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.vars.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.vars.outputs.skip != 'true'
      - id: promote
        name: Gắn tag phiên bản cho image staging cùng commit
        if: steps.vars.outputs.skip != 'true' && steps.vars.outputs.version != ''
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$SHA_TAG" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$SHA_TAG"
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$SHA_TAG → $IMAGE:$VERSION"
          else
            echo "$IMAGE:$SHA_TAG chưa có → build mới"
          fi
      - id: meta
        if: steps.vars.outputs.skip != 'true' && steps.promote.outputs.done != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern=v{{version}}
      - name: Build + push
        if: steps.vars.outputs.skip != 'true' && steps.promote.outputs.done != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
