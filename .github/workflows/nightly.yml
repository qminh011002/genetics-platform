# Nightly (T0105 · blueprint.md §4 · quality-standards.md §2): e2e + visual (Playwright) và audit phụ thuộc (cảnh báo).
# e2e cũng chạy trên PR có nhãn `e2e`. Không phải required check.
# Cách chạy Playwright (image pin mcr.microsoft.com/playwright:v1.64.1-noble, webServer / compose profile test, shard)
# do T0403 / T0406 định nghĩa trong script `test:e2e` / `test:visual` của từng app; ở đây chỉ gọi turbo.
name: nightly

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ Việt Nam
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          python: 'true'
      - name: e2e (Playwright + axe + PWA)
        run: pnpm test:e2e
      - name: visual regression
        run: pnpm test:visual
      - name: Báo cáo Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Init: chỉ cảnh báo; Harden (W4) đổi sang fail khi có lỗ hổng high (quality-standards.md §4).
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          python: 'true'
          install: 'false'
      - name: pnpm audit
        run: pnpm audit --audit-level high || echo "::warning title=pnpm audit::Có lỗ hổng mức high trở lên (xem log)"
      - name: pip-audit
        run: uv run --locked pip-audit --skip-editable || echo "::warning title=pip-audit::Có lỗ hổng trong dependency Python (xem log)"
