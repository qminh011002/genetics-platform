# Workspace pnpm 12. `catalog:` là nơi DUY NHẤT ghi version thư viện dùng chung (ADR-0001);
# package con khai báo `"react": "catalog:"`. `scripts/check-catalog.mjs` báo package ghi version riêng.
# Nhóm và dòng phiên bản theo docs/tasks/initialization/blueprint.md §3; thêm gói ngoài danh sách = PR nhãn deps-approved.
packages:
  - apps/*
  - packages/*
  - services/backend

catalog:
  # React
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  babel-plugin-react-compiler: 1.0.0 # pin
  '@rolldown/plugin-babel': ^0.2.4
  # Build / test
  vite: ^8.3.5
  '@vitejs/plugin-react': ^6.1.2
  typescript: ~5.9.3
  tsx: ^4.23.15
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@testing-library/jest-dom': ^7.0.1
  jsdom: ^30.1.3
  msw: 2.15.0 # pin (OQ-10)
  '@faker-js/faker': ^10.6.0
  '@playwright/test': 1.64.1 # pin, khớp image mcr.microsoft.com/playwright:v1.64.1-noble
  '@axe-core/playwright': ^4.14.0
  size-limit: ^14.3.0
  # Router / data
  '@tanstack/react-router': ^1.170.46
  '@tanstack/router-plugin': ^1.168.48
  '@tanstack/react-query': ^5.105.0
  '@tanstack/react-table': ^9.3.1
  '@tanstack/react-virtual': ^3.14.23
  # UI
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@base-ui-components/react': 1.0.0-rc.0
  lucide-react: ^1.61.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  sonner: ^2.0.8
  cmdk: ^1.1.1
  recharts: ^3.10.1
  # Form
  react-hook-form: ^7.91.0
  '@hookform/resolvers': ^6.0.0
  zod: ^4.6.7
  # Auth
  '@azure/msal-browser': ^5.26.0
  '@azure/msal-react': ^5.7.3
  # i18n / date
  i18next: ^26.5.11
  react-i18next: ^17.1.9
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  # Codegen
  orval: ^8.45.0
  # Lint / format
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-boundaries: ^7.3.0
  eslint-plugin-i18next: ^6.1.5
  dependency-cruiser: ^18.7.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  # Mobile
  vite-plugin-pwa: ^2.0.0
  idb: ^8.0.4
  barcode-detector: ^3.2.3
