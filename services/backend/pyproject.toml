[project]
name = "genetics-platform-backend"
version = "0.1.0"
description = "Genetics Data Platform · backend FastAPI (modular monolith, ADR-0002)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "alembic-utils>=0.8.8",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
genetics = "genetics.cli:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "schemathesis>=4.32.5",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "genetics"

# Ruff: kế thừa cấu hình gốc (quality-standards.md §2.1); chỉ khai báo src-layout để isort nhận `genetics` là first-party.
# mypy: dùng config gốc qua `--config-file ../../pyproject.toml` (package.json `typecheck`).
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: domain + application, không DB",
    "integration: cần Postgres thật (testcontainers)",
    "api: httpx AsyncClient + ASGITransport",
    "contract: schemathesis trên openapi.json",
]
addopts = "-ra --strict-markers"
