[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# MIGRATION_DATABASE_URL is read by env.py, never stored here.

[loggers]
keys = root,sqlalchemy,alembic,alembic_utils

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_alembic_utils]
level = WARNING
handlers =
qualname = alembic_utils

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
