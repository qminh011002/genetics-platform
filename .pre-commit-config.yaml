# Hook Python + secret; được gọi từ .husky/pre-commit (husky là hook git duy nhất, không chạy `pre-commit install`).
# JS/TS do lint-staged (prettier, eslint) xử lý; commit message do commitlint (.husky/commit-msg).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (services/backend)
        language: system
        pass_filenames: false
        files: ^services/backend/.*\.py$
        entry: bash -c 'if [ -f services/backend/.importlinter ]; then uv run --project services/backend lint-imports; fi'
