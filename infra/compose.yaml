# Genetics Data Platform · Docker Compose (infrastructure.md §3–7, ADR-0012, ADR-0005).
# Chạy từ thư mục infra/: `docker compose --profile dev up --wait` (local), xem compose.dev.yaml / compose.prod.yaml.
# Không có khoá `version:` (Compose spec). Mọi service có healthcheck; depends_on dùng condition: service_healthy.
#
# Profile:
#   (mặc định) postgres, api, worker, web, mobile, nginx, backup
#   dev        + pgadmin, mailpit (compose.dev.yaml)
#   test       + postgres-test (tmpfs, cổng 5433) cho CI / test tích hợp
#   ops        + uptime-kuma
#
# Image app (api/worker, web, mobile) do T0107 / T0108 cung cấp Dockerfile; ở đây chỉ khai báo build context
# và tên image. Prod ghi đè image GHCR theo IMAGE_TAG (compose.prod.yaml).

name: ${COMPOSE_PROJECT_NAME:-genetics}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-app-env: &app-env
  ENV: ${ENV:-local}
  AUTH_MODE: ${AUTH_MODE:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://app_rw:${APP_RW_PASSWORD:?APP_RW_PASSWORD missing}@postgres:5432/${POSTGRES_DB:-genetics}
  MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:${APP_MIGRATOR_PASSWORD:?APP_MIGRATOR_PASSWORD missing}@postgres:5432/${POSTGRES_DB:-genetics}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
  ENTRA_WEB_CLIENT_ID: ${ENTRA_WEB_CLIENT_ID:-}
  ENTRA_MOBILE_CLIENT_ID: ${ENTRA_MOBILE_CLIENT_ID:-}
  FILE_STORAGE_ROOT: /data/files
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost}
  PUBLIC_MOBILE_URL: ${PUBLIC_MOBILE_URL:-http://localhost/app}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-}
  WORKER_HEARTBEAT_FILE: /tmp/worker.alive

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genetics}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?APP_MIGRATOR_PASSWORD missing}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?APP_RW_PASSWORD missing}
      APP_ANALYTICS_RO_PASSWORD: ${APP_ANALYTICS_RO_PASSWORD:?APP_ANALYTICS_RO_PASSWORD missing}
    volumes:
      # Image postgres:18 đặt PGDATA theo version → mount /var/lib/postgresql (không phải .../data).
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Chỉ bind localhost ở local; prod bỏ hẳn (compose.prod.yaml).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB} -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging

  api:
    image: ${API_IMAGE:-genetics-api}:${IMAGE_TAG:-local}
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Entrypoint của image (T0107) chạy `alembic upgrade head` rồi uvicorn (infrastructure.md §6.3).
    environment: *app-env
    volumes:
      - files:/data/files
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python:3.13-slim không có curl; dùng stdlib.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  worker:
    image: ${API_IMAGE:-genetics-api}:${IMAGE_TAG:-local}
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['genetics', 'worker']
    environment: *app-env
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Worker ghi heartbeat vào WORKER_HEARTBEAT_FILE mỗi ≤ 60 s (hợp đồng với T0107); coi là chết nếu cũ hơn 180 s.
      test:
        [
          'CMD-SHELL',
          'test -f /tmp/worker.alive && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker.alive) )) -lt 180',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-genetics-web}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  mobile:
    image: ${MOBILE_IMAGE:-genetics-mobile}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      NGINX_HTTP_PORT: 80
      NGINX_MAX_BODY: ${NGINX_MAX_BODY:-25m}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mobile:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'nginx -t >/dev/null 2>&1 && wget -q -O /dev/null http://127.0.0.1/healthz || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  backup:
    # Cùng image postgres để có pg_dump / pg_restore đúng major version. Vòng lặp cron trong backup/cron.sh.
    image: postgres:18
    restart: unless-stopped
    user: postgres
    entrypoint: ['/opt/backup/cron.sh']
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: app_migrator
      PGPASSWORD: ${APP_MIGRATOR_PASSWORD:?APP_MIGRATOR_PASSWORD missing}
      PGDATABASE: ${POSTGRES_DB:-genetics}
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      OFFSITE_TARGET: ${OFFSITE_TARGET:-}
      FILES_DIR: /data/files
    volumes:
      - ./backup:/opt/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - files:/data/files:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # cron.sh chạm /backups/.heartbeat mỗi phút; quá 5 phút → unhealthy.
      test:
        [
          'CMD-SHELL',
          'test -f /backups/.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /backups/.heartbeat) )) -lt 300',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  postgres-test:
    profiles: [test]
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genetics}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-app_rw}
      APP_ANALYTICS_RO_PASSWORD: ${APP_ANALYTICS_RO_PASSWORD:-app_analytics_ro}
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB} -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  uptime-kuma:
    profiles: [ops]
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptime-kuma:/app/data
    ports:
      - '${UPTIME_KUMA_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'extra/healthcheck || exit 1']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    logging: *default-logging

volumes:
  pgdata:
  files:
  uptime-kuma:
