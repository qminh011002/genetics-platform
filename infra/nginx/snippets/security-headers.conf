# Header bảo mật (infrastructure.md §9). Nginx: add_header trong location GHI ĐÈ toàn bộ add_header ở server
# → mọi location có add_header riêng phải include lại file này.
# $csp và $hsts được `set` trong server block của template (prod: HSTS có giá trị; HTTP local: rỗng → nginx bỏ qua).
add_header Content-Security-Policy $csp always;
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Không đặt Cross-Origin-Opener-Policy: trang bridge MSAL /auth-redirect.html cần window.opener (mobile.md §4).
