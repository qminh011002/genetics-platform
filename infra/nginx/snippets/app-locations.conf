# Routing chung cho HTTP (local) và TLS (prod) — infrastructure.md §3:
#   /                      → web (SPA, fallback index.html)
#   /app/                  → mobile PWA (SPA, fallback index.html; edge bỏ tiền tố /app, image mobile phục vụ dist ở /)
#   /api/                  → api:8000 (giữ nguyên path /api/v1/...)
#   /readyz                → api (passthrough, không token)
#   /healthz               → nginx tự trả 200 (nginx sống; api sống kiểm bằng healthcheck container + /readyz)
#   /auth-redirect.html, /app/auth-redirect.html → no-store (bridge MSAL v5)
# Upstream qua biến + resolver Docker để nginx vẫn khởi động / trả 502 khi app chưa có (tiêu chí T0106 #2).

resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;
set $web_upstream http://web:80;
set $mobile_upstream http://mobile:80;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml application/wasm;

# ---- health ---------------------------------------------------------------
location = /healthz {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "ok\n";
}

location = /readyz {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $api_upstream;
    include snippets/proxy-params.conf;
}

# ---- API ------------------------------------------------------------------
location /api/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $api_upstream;
    include snippets/proxy-params.conf;
    proxy_request_buffering off;
}

# ---- mobile PWA tại /app --------------------------------------------------
location = /app {
    return 301 /app/;
}

location = /app/auth-redirect.html {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass $mobile_upstream;
    include snippets/proxy-params.conf;
}

# sw.js / manifest / index.html: trình duyệt phải kiểm lại mỗi lần (cập nhật PWA, mobile.md §7).
location ~ ^/app/(sw\.js|manifest\.webmanifest|index\.html|registerSW\.js)$ {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass $mobile_upstream;
    include snippets/proxy-params.conf;
}

location /app/assets/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass $mobile_upstream;
    include snippets/proxy-params.conf;
}

location /app/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass $mobile_upstream;
    include snippets/proxy-params.conf;
    proxy_intercept_errors on;
    error_page 404 = @mobile_index;
}

location @mobile_index {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
    proxy_pass $mobile_upstream;
    include snippets/proxy-params.conf;
}

# ---- web tại / -------------------------------------------------------------
location = /auth-redirect.html {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $web_upstream;
    include snippets/proxy-params.conf;
}

location /assets/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass $web_upstream;
    include snippets/proxy-params.conf;
}

location / {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    proxy_pass $web_upstream;
    include snippets/proxy-params.conf;
    proxy_intercept_errors on;
    error_page 404 = @web_index;
}

location @web_index {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    rewrite ^ /index.html break;
    proxy_pass $web_upstream;
    include snippets/proxy-params.conf;
}
