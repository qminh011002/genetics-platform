# Công cụ dev (profile `dev`): pgadmin, mailpit. Dùng kèm compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml --profile dev up --wait
# Không dùng trên VM staging / production.

services:
  pgadmin:
    profiles: [dev]
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/misc/ping || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}

  worker:
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}

volumes:
  pgadmin:
